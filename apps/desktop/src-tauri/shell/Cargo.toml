[package]
name = "dotdock-shell"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Windows shell integration for dotDock (no UI framework; unit-testable)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
thiserror = "2"
base64 = "0.23"
ureq = { version = "3", features = ["json"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Foundation", "Media_Control", "Storage_Streams", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
