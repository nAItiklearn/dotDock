[package]
name = "dotdock"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Dot-matrix desktop environment for Windows"
publish = false

[lib]
name = "dotdock_lib"
# rlib only: cdylib is for mobile targets and overflows the MinGW export table.
crate-type = ["rlib"]

[workspace]
members = ["shell", "island", "island-hook", "sentinel", "dock", "tiles"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotdock-shell = { path = "shell" }
dotdock-dock = { path = "dock" }
dotdock-island = { path = "island", features = ["watch"] }
dotdock-tiles = { path = "tiles" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
