[package]
name = "dotdock-island-hook"
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Hook runner for Agent Island (Claude Code, GitHub Copilot CLI): records what the agent is doing, then exits"
publish = false

[[bin]]
name = "dotdock-island-hook"
path = "src/main.rs"

[dependencies]
dotdock-island = { path = "../island", default-features = false }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
