[package]
name = "dotdock-island"
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Agent Island core: session states, transcript parsing and Connect/Disconnect (no UI framework; unit-testable)"
publish = false

[features]
default = ["watch"]
# The folder/log watcher and its event loop. The hook binary leaves this off to stay tiny.
watch = ["dep:notify"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the user's key order when Connect rewrites settings.json.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
notify = { version = "8", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_System_Threading",
  "Win32_System_Kernel",
] }

[dev-dependencies]
tempfile = "3"
