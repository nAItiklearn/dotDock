name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Explicit MSVC toolchain: the owner's local GNU override must never apply here.
  RUST_TOOLCHAIN: stable-x86_64-pc-windows-msvc

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      # No root package.json and no "packageManager" field, so the version is explicit.
      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # --passWithNoTests: vitest exits 1 when no test files exist yet.
      - run: pnpm test --passWithNoTests
      # Repository tools written in plain Node (the island session replay).
      - run: node --test ../../tools/island-replay.test.mjs ../../tools/island-claude-settings.test.mjs
      - run: pnpm build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all --check
        working-directory: apps/desktop/src-tauri

      # tauri::generate_context! requires frontendDist (apps/desktop/dist) to exist at compile time.
      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build frontend (provides dist)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: apps/desktop

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Test
        run: cargo test --workspace
        working-directory: apps/desktop/src-tauri

  audit:
    name: cargo audit
    # Reads Cargo.lock only, so no MSVC toolchain is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Exits non-zero on vulnerabilities only; unmaintained/unsound/yanked are warnings.
      - name: Audit Cargo.lock
        run: cargo audit
        working-directory: apps/desktop/src-tauri

  bundle:
    name: Bundle (NSIS installer + portable exe)
    runs-on: windows-latest
    timeout-minutes: 60
    # Only package builds that passed lint and tests.
    needs: [frontend, rust]
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The restore watchdog ships beside dotdock.exe. It is added to the bundle by a config merge
      # and not in tauri.conf.json, because a configured resource must exist for every build of the
      # app (clippy included). Without the file the core runs the watchdog from its own exe.
      - name: Build the restore sentinel
        run: cargo build --release -p dotdock-sentinel
        working-directory: apps/desktop/src-tauri

      # beforeBuildCommand (pnpm build) produces the frontend; output is target/release/bundle/nsis.
      # Updater signatures need the release key, which only release.yml has, so CI bundles skip them.
      - name: Build bundle
        run: pnpm tauri build --config src-tauri/tauri.sentinel.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Read app version
        id: app
        run: echo "version=$(node --input-type=commonjs -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Stage portable exe
        run: |
          mkdir -p ../../staging/portable
          cp src-tauri/target/release/dotdock.exe "../../staging/portable/dotDock_${{ steps.app.outputs.version }}_x64-portable.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: dotdock-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: dotdock-windows-portable
          path: staging/portable/*.exe
          if-no-files-found: error
          retention-days: 14
