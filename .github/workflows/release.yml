name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Explicit MSVC toolchain: the owner's local GNU override must never apply here.
  RUST_TOOLCHAIN: stable-x86_64-pc-windows-msvc

jobs:
  bundle:
    name: Bundle (NSIS installer + portable exe)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Read app version
        id: app
        run: echo "version=$(node --input-type=commonjs -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # The installer filename and the "About" version come from tauri.conf.json, not the tag.
      - name: Check tag matches app version
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP_VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # The restore watchdog ships beside dotdock.exe (see ci.yml for why it is not in tauri.conf.json).
      - name: Build the restore sentinel
        run: cargo build --release -p dotdock-sentinel
        working-directory: apps/desktop/src-tauri

      # The notch's hook is built into dotdock.exe (build.rs, D-047), so the installer and the portable exe both
      # carry it: without it, Connect had no hook program and failed for every user.
      - name: Build the island hook
        run: cargo build --release -p dotdock-island-hook
        working-directory: apps/desktop/src-tauri

      # Cold build on purpose: release artifacts do not use the shared rust cache.
      # createUpdaterArtifacts signs the installer with the project's minisign key (*.exe.sig).
      - name: Build bundle
        run: pnpm tauri build --config src-tauri/tauri.sentinel.conf.json
        env:
          DOTDOCK_EMBED_HOOK: ${{ github.workspace }}/apps/desktop/src-tauri/target/release/dotdock-island-hook.exe
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The in-app updater reads releases/latest/download/latest.json; it points at this tag's installer.
      - name: Write updater manifest
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          installer="dotDock_${APP_VERSION}_x64-setup.exe"
          sig="src-tauri/target/release/bundle/nsis/${installer}.sig"
          mkdir -p ../../staging/updater
          cp "$sig" ../../staging/updater/
          SIG_FILE="$sig" URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/${installer}" node --input-type=commonjs -e '
            const fs = require("fs");
            const manifest = {
              version: process.env.APP_VERSION,
              notes: `dotDock ${process.env.APP_VERSION}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(process.env.SIG_FILE, "utf8").trim(), url: process.env.URL } },
            };
            fs.writeFileSync("../../staging/updater/latest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Stage portable exe
        run: |
          mkdir -p ../../staging/portable
          cp src-tauri/target/release/dotdock.exe "../../staging/portable/dotDock_${{ steps.app.outputs.version }}_x64-portable.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: dotdock-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: dotdock-windows-portable
          path: staging/portable/*.exe
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: dotdock-windows-updater
          path: staging/updater/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dotdock-windows-*
          path: release-assets
          merge-multiple: true

      # No Authenticode certificate yet, so SmartScreen will warn; updates are minisign-signed.
      # A tag with a hyphen (v0.2.0-rc.1) is published as a prerelease.
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
